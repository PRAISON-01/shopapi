[project]
name = "shopapi"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "nwankwo praise", email = "nwankwopraison@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "common>=0.1.2",
    "django>=6.1.3",
    "djangorestframework>=3.18.3",
    "djangorestframework-simplejwt>=5.5.1",
    "drf-nested-routers>=0.96.0",
    "psycopg[binary]>=3.3.9",
    "python-dotenv>=1.2.4",
]

[project.scripts]
shopapi = "shopapi:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.uv]
package = false
